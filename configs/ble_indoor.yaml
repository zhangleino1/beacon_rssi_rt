title: "Sionna RT GUI - Indoor Apartment 2.4GHz BLE"
gui_mode: FULL
background_color: [0.08, 0.09, 0.11]

rendering:
  mode: RAY_TRACING
  default_slice_plane_enabled: false
  max_accumulated_spp: 128

radio_map:
  auto_update: true
  center: [0.0, 0.0, 1.0]
  orientation: [0.0, 0.0, 0.0]
  size: [8.4, 9.0]
  cell_size: [0.12, 0.12]
  max_depth: 5
  los: true
  specular_reflection: true
  diffuse_reflection: true
  refraction: true
  color_map: "viridis"
  vmin: -95.0
  vmax: -35.0

paths:
  auto_update: true
  max_depth: 5
  los: true
  specular_reflection: true
  refraction: true
